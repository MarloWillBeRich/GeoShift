name: GeoShift
options:
  bundleIdPrefix: com.geoshift
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  GeoShift:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "GeoShift"
        CFBundleIdentifier: "com.geoshift.app"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "GeoShift requiert l'accès à la localisation pour afficher la télémétrie matérielle réelle et la comparer avec les simulations."
        NSLocationAlwaysAndWhenInUseUsageDescription: "GeoShift utilise les coordonnées pour le suivi continu et la simulation de trajectoires."
        UIFileSharingEnabled: YES
        LSSupportsOpeningDocumentsInPlace: YES
    settings:
      base:
        PRODUCT_NAME: "GeoShift"
        PRODUCT_BUNDLE_IDENTIFIER: "com.geoshift.app"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

  GeoShiftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/GeoShiftTests
    dependencies:
      - target: GeoShift
    settings:
      base:
        PRODUCT_NAME: "GeoShiftTests"
        PRODUCT_BUNDLE_IDENTIFIER: "com.geoshift.tests"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GeoShift.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GeoShift"
        BUNDLE_LOADER: "$(TEST_HOST)"
