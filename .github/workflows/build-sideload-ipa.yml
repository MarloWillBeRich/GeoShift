name: Build Sideloadable IPA (Free Apple ID Ready)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build & Test GeoShift-Unsigned.ipa
    runs-on: macos-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Select Latest Xcode 16 / 15
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            echo "⚡ Installation rapide de XcodeGen 2.47.0..."
            curl -Ls https://github.com/yonaskolb/XcodeGen/releases/download/2.47.0/xcodegen.zip -o /tmp/xcodegen.zip
            unzip -q /tmp/xcodegen.zip -d /tmp
            sudo /tmp/xcodegen/install.sh
            rm -rf /tmp/xcodegen.zip /tmp/xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la GeoShift.xcodeproj

      - name: Run Unit Tests (XCTest - Échec Bloquant)
        run: |
          DEVICE_DEST=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | awk -F'(' '{print $1}' | xargs)
          if [ -z "$DEVICE_DEST" ]; then DEVICE_DEST="iPhone 16"; fi
          echo "Exécution des tests XCTest sur : $DEVICE_DEST"
          xcodebuild test \
            -project GeoShift.xcodeproj \
            -scheme GeoShift \
            -destination "platform=iOS Simulator,name=$DEVICE_DEST" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build Unsigned IPA
        run: |
          chmod +x scripts/build_sideload_ipa.sh
          ./scripts/build_sideload_ipa.sh

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoShift-Unsigned-IPA
          path: build/GeoShift-Unsigned.ipa
          retention-days: 30

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          retention-days: 14

      - name: Upload Demo GPX Track
        uses: actions/upload-artifact@v4
        with:
          name: DemoRoute_Paris-GPX
          path: Resources/DemoRoute_Paris.gpx
          retention-days: 30
