name: Build Sideloadable IPA (Free Apple ID Ready)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build GeoShift-Sideload.ipa
    runs-on: macos-14

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Select Latest Xcode 15 / 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la GeoShift.xcodeproj

      - name: Run Unit Tests (XCTest)
        run: |
          SIMULATOR_NAME=$(xcrun simctl list devices available | grep -E "iPhone (16|15|14)" | head -n 1 | awk -F'(' '{print $1}' | xargs)
          if [ -z "$SIMULATOR_NAME" ]; then SIMULATOR_NAME="iPhone 15"; fi
          echo "Test sur simulateur : $SIMULATOR_NAME"
          xcodebuild test \
            -project GeoShift.xcodeproj \
            -scheme GeoShiftTests \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build Sideloadable IPA
        run: |
          chmod +x scripts/build_sideload_ipa.sh
          ./scripts/build_sideload_ipa.sh

      - name: Upload Sideloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoShift-Sideload-IPA
          path: |
            build/GeoShift-Sideload.ipa
            build/GeoShift-Unsigned.ipa
          retention-days: 30

      - name: Upload Demo GPX Track
        uses: actions/upload-artifact@v4
        with:
          name: DemoRoute_Paris-GPX
          path: Resources/DemoRoute_Paris.gpx
          retention-days: 30
