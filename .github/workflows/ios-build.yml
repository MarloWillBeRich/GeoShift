name: iOS Build & IPA Generation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test GeoShift iOS
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode 15 / 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Install XcodeGen via Homebrew
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la GeoShift.xcodeproj

      - name: Run Unit Tests (XCTest)
        run: |
          xcodebuild test \
            -project GeoShift.xcodeproj \
            -scheme GeoShiftTests \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA Archive
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoShift-iOS-IPA
          path: build/GeoShift_unsigned.ipa
          retention-days: 14

      - name: Upload Demo GPX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemoRoute_Paris-GPX
          path: Resources/DemoRoute_Paris.gpx
          retention-days: 14
